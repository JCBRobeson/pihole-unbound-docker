# More info at https://github.com/pi-hole/docker-pi-hole/ and https://docs.pi-hole.net/
services:
  pihole:
    container_name: pihole
    image: pihole/pihole:latest
    ports:
      # DNS Ports
      - "53:53/tcp"
      - "53:53/udp"
      # Web UI on host 8053 (8080 = qBittorrent via gluetun, 8090 = Heimdall)
      # Host 80/443 kept free for Caddy
      - "8053:80/tcp"
      # Dropped: Pi-hole's self-signed HTTPS. Host 443 reserved for Caddy,
      # which will serve the UI over trusted HTTPS later.
      # - "443:443/tcp"
      # Uncomment the line below if you are using Pi-hole as your DHCP server
      #- "67:67/udp"
      # Uncomment the line below if you are using Pi-hole as your NTP server
      #- "123:123/udp"
    networks:
      dns-net:
        ipv4_address: 172.28.0.3
    environment:
      # Set the appropriate timezone for your location (https://en.wikipedia.org/wiki/List_of_tz_database_time_zones), e.g:
      TZ: '${TZ}'
      # Set a password to access the web interface. Not setting one will result in a random password being assigned
      FTLCONF_webserver_api_password: '${PIHOLE_PASSWORD}'
      # Allow app passwords to change settings/import data. Only set true on a
      # replica that a sync tool (e.g. nebula-sync) writes to. Default: false
      FTLCONF_webserver_api_app_sudo: '${PIHOLE_APP_SUDO:-false}'
      # If using Docker's default `bridge` network setting the dns listening mode should be set to 'ALL'
      FTLCONF_dns_listeningMode: 'ALL'
      # Upstream = Unbound's static IP on dns-net. No public resolvers alongside it,
      # or Pi-hole would split queries between them and leak to Cloudflare/Google.
      FTLCONF_dns_upstreams: '172.28.0.2#53'
      # NTP off: server's chronyd owns the clock; containers share the host kernel's time
      FTLCONF_ntp_sync_active: 'false'
      FTLCONF_ntp_ipv4_active: 'false'
      FTLCONF_ntp_ipv6_active: 'false'
      FTLCONF_database_maxDBdays: '14'
      FTLCONF_misc_privacylevel: '0'
      FTLCONF_dns_revServers: 'true,${LAN_SUBNET},${LAN_GATEWAY}#53,${LAN_DOMAIN}'
      # Volumes store your data between container upgrades
    volumes:
      # For persisting Pi-hole's databases and common configuration file
      - './pihole:/etc/pihole'
    cap_add:
      # See https://docs.pi-hole.net/docker/configuration/#note-on-capabilities
      # Required if you are using Pi-hole as your DHCP server, else not needed
      # - NET_ADMIN
      # Required if you are using Pi-hole as your NTP client to be able to set the host's system time
      # - SYS_TIME
      # Optional, if Pi-hole should get some more processing time
      - SYS_NICE
    restart: unless-stopped
    depends_on:
      unbound:
        condition: service_healthy

  unbound:
    container_name: unbound
    image: klutchell/unbound:latest
    volumes:
      - './unbound/custom.conf.d:/etc/unbound/custom.conf.d:ro'
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "drill-hc", "@127.0.0.1", "dnssec.works"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      dns-net:
        ipv4_address: 172.28.0.2

networks:
  dns-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/24
          gateway: 172.28.0.1
    
